upstream nextjs_app {
    server web-ui:3000;
}

upstream finnhub_api_ws {
    server finnhub-api:8000;
}

server {
    listen 80;
    server_name localhost;

    location /stock_summary/ws {
        proxy_pass http://finnhub_api_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_next/ {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_grade;
    }

    location /public/ {
        alias /usr/share/nginx/html/public;
    }

    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_grade;
    }
}
